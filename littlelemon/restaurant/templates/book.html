{% extends 'base.html' %}
{% load static %}

{% block content %}
<section>
  <article>
    <h1>Make a reservation</h1>
    <!--Begin row-->
    <div class="row">
      <!--Begin col-->
      <div class="column">
          {% csrf_token %}
          <form method="POST" id="form">
            <!-- {% csrf_token %} -->
            <p>
              <label for="first_name">Name:</label>
              <input type="text" placeholder="Your Name" maxlength="200" required="" id="first_name">
            </p>
            <p>
            <!-- Step 9: Part one -->
            </p>
                        <label for="reservation_date">Booking Date</label>
      <input type="date" name="reservation_date" id="reservation_date" />

            <p>
              <label for="reservation_slot">Reservation time:</label>
              <select id="reservation_slot">
                <option value="0" disabled>Select time</option>
              </select>
            </p>
            <button type="button" id="button">Reserve</button>
          </form>
      </div>
      <!--End col-->

      <!--Begin col-->
      <div class="column">
        <h2>Bookings For <span id="today"></span></h2>
        <div id="bookings">
        </div>
      </div>
      <!--End col-->
    </div>
    <!--End row-->




  </article>
</section>
<script>

const date = new Date();
const year = date.getFullYear();
const month = String(date.getMonth() + 1).padStart(2, '0'); // Months are 0-indexed, so add 1
const day = String(date.getDate()).padStart(2, '0');

const formattedDate = `${year}-${month}-${day}`;
//console.log(formattedDate);
  //console.log(date.getFullYear(),date.getMonth()+1,date.getDate())
  //document.getElementById('reservation_date').value = `${date.getFullYear()}-${date.getMonth() + 1}-${date.getDate().toString().padStart(2, "0")}`
   document.getElementById('reservation_date').value = formattedDate
  console.log(document.getElementById('reservation_date').value)
  getBookings()


  /*  Step 10: Part two */

  document.getElementById('reservation_date').addEventListener('change',getBookings)
  function getBookings() {
    console.log("In getBookings")
    let reserved_slots = []
    //date = document.getElementById('reservation_date').value
    document.getElementById('today').innerHTML = document.getElementById('reservation_date').value
   
    fetch("{% url 'bookings' %}" + '?date=' + document.getElementById('reservation_date').value)
      .then(r => r.json())
      .then(data => {
        if (Array.isArray(data)) {
          console.log("if data")
        }
        else if (data && data.results && Array.isArray(data.results)) {
                    console.log("ifelse data")
                } 
        reserved_slots = []
        bookings = ''
        //console.log("data",data[0].fields.reservation_slot)
        console.log("data",data)
        /* Step 11: Part three */
        for(const item of data){
          //console.log("item",item.fields.reservation_slot)
          reserved_slots.push(item.fields.reservation_slot)
          bookings += `<p>${item.fields.first_name} - ${formatTime(item.fields.reservation_slot)}</p>`
        }



        /* Step 12: Part four  */
        slot_options =`<option value="0" disabled>Select time</option>`
        for(let i=10;i<20;i++){
          const label=formatTime(i)
          
          if(reserved_slots.includes(i)){
            slot_options += `<option value=${i} disabled>${label}</option>`
          }
          else{
            slot_options += `<option value=${i}>${label}</option>`
            //console.log("slot_options",slot_options)
          }

        }

        //console.log("bookings",bookings)
        document.getElementById('reservation_slot').innerHTML = slot_options
        if(bookings==''){
          bookings = "No bookings"
        }
        document.getElementById('bookings').innerHTML = bookings
      }) .catch(error => {
    console.error('Fetch error:', error); 
    alert("Error", error)// Handle network errors or errors in the .then chain
  });
  }

  function formatTime(time) {
    const ampm = time < 12 ? 'AM' : 'PM'
    const t = time < 12 ? time : time > 12 ? time - 12 : time
    const label = `${t} ${ampm}`
    return label
  }


  document.getElementById('button').addEventListener('click', function (e) {
    const formdata = {
      first_name: document.getElementById('first_name').value,
      reservation_date: document.getElementById('reservation_date').value,
      reservation_slot: document.getElementById('reservation_slot').value,
    }

    fetch("{% url 'bookings' %}", { method: 'post', body: JSON.stringify(formdata) })
      .then(r => r.text())
      .then(data => {
        getBookings()
      })
  })
</script>
{% endblock %}
